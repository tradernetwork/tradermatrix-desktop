[package]
name = "tradermatrix-desktop"
version = "0.1.0"
description = "TraderMatrix Desktop shell"
edition = "2021"
publish = false
license = "MIT"

[features]
# Public (distributed) build: hides the experimental local-CLI cards for good (M19 gating, created minimally by M21). Default off for the personal build.
public-build = []

[lib]
name = "rebull_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net", "io-util"] }
keyring = { version = "3", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }
thiserror = "2"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = "0.11"
getrandom = "0.4"
zeroize = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "form", "http2"] }
async-trait = "0.1"
url = "2"
sha2 = "0.11"
base64 = "0.23"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"

[profile.release]
# panic stays the default (unwind): the keyring probe relies on catch_unwind. Money math: overflow panics, never wraps.
overflow-checks = true
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "sync", "net", "io-util", "test-util"] }
